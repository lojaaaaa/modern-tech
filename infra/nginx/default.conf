resolver 127.0.0.11 valid=5s ipv6=off;
upstream backend_api {
 zone backend_api 64k;
 server api:9000 resolve;
}
upstream frontend_dev {
 zone frontend_dev 64k;
 server web:5173 resolve;
}
server {
 listen 80;
 server_name _;
 root /var/www/html/public;
 client_max_body_size 51m;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy same-origin always;
 location = /api/v1/connections/yandex/callback {
  access_log off;
  add_header Referrer-Policy no-referrer always;
  add_header X-Content-Type-Options nosniff always;
  include fastcgi_params;
  fastcgi_pass backend_api;
  fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
  fastcgi_param SCRIPT_NAME /index.php;
  fastcgi_param HTTP_HOST $http_host;
 }
 location / { proxy_pass http://frontend_dev; proxy_set_header Host $host; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
 location ~ ^/(api|sanctum|health|docs)(/|$) {
  include fastcgi_params;
  fastcgi_pass backend_api;
  fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
  fastcgi_param SCRIPT_NAME /index.php;
  fastcgi_param HTTP_HOST $http_host;
 }
}
