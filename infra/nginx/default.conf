resolver 127.0.0.11 valid=5s ipv6=off;
map $http_upgrade $office_connection {
 default upgrade;
 '' close;
}
map $http_x_forwarded_proto $office_scheme {
 default $scheme;
 https https;
}
# Start the Word SDK download before the editor HTML starts its scripts.
map $request_uri $office_sdk_preload {
 default "";
 "~^/office-editor/(?<office_build>[0-9]+\.[0-9]+\.[0-9]+-[a-f0-9]+)/web-apps/apps/documenteditor/main/index\.html(?:\?|$)" "</office-editor/${office_build}/sdkjs/word/sdk-all.js>; rel=preload; as=script";
}
upstream backend_api {
 zone backend_api 64k;
 server api:9000 resolve;
}
upstream frontend_dev {
 zone frontend_dev 64k;
 server web:5173 resolve;
}
server {
 listen 80;
 server_name _;
 root /var/www/html/public;
 client_max_body_size 51m;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy same-origin always;
 add_header Content-Security-Policy "frame-ancestors 'self'" always;
 add_header X-Frame-Options SAMEORIGIN always;
 add_header Link $office_sdk_preload;
 location ~ ^/api/v1/connections/google/callback$ {
  access_log off;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "frame-ancestors 'self'" always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header X-Content-Type-Options nosniff always;
  include fastcgi_params;
  fastcgi_pass backend_api;
  fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
  fastcgi_param SCRIPT_NAME /index.php;
  fastcgi_param HTTP_HOST $http_host;
 }
 location / { proxy_pass http://frontend_dev; proxy_set_header Host $host; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
 location ^~ /office-editor/ {
  set $office_backend http://office-documentserver;
  rewrite ^/office-editor(/.*)$ $1 break;
  proxy_pass $office_backend;
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Host $http_host/office-editor;
  proxy_set_header X-Forwarded-Proto $office_scheme;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $office_connection;
  proxy_read_timeout 3600s;
 }
 location ~ ^/(api|sanctum|health|docs)(/|$) {
  include fastcgi_params;
  fastcgi_pass backend_api;
  fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
  fastcgi_param SCRIPT_NAME /index.php;
  fastcgi_param HTTP_HOST $http_host;
 }
}
