[supervisord]
nodaemon=true
user=root

[program:redis]
command=redis-server --bind 127.0.0.1 --save "" --appendonly no
user=www-data

[program:web]
command=apache2-foreground
autorestart=true

[program:worker]
command=php artisan queue:work redis --queue=short,default,processing,transfers --timeout=900 --tries=3
user=www-data
autorestart=true

[program:scheduler]
command=php artisan schedule:work
user=www-data
autorestart=true
