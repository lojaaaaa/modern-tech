<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1.0" />
        <meta name="theme-color" content="#f7f8fa" />
        <title>Modern Tech — документы команды</title>
        <script>
            try {
                const saved = JSON.parse(localStorage.getItem('modern-tech-theme') ?? 'null');
                const isDark = saved?.version === 1 ? saved.state?.isDark : saved?.state?.dark;
                document.documentElement.classList.toggle('dark', isDark === true);
            } catch {}
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/app/main.tsx"></script>
    </body>
</html>
