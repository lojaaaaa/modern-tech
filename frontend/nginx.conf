resolver 127.0.0.11 valid=5s ipv6=off;
upstream backend_api {
 zone backend_api 64k;
 server api:9000 resolve;
}
map $http_upgrade $office_connection { default upgrade; '' close; }
map $http_x_forwarded_proto $office_scheme { default $scheme; https https; }
server {
 listen 80;
 client_max_body_size 51m;
 root /usr/share/nginx/html;
 add_header X-Content-Type-Options nosniff always;
 add_header Content-Security-Policy "frame-ancestors 'self'" always;
 add_header X-Frame-Options SAMEORIGIN always;
 add_header Referrer-Policy same-origin always;
 location / { try_files $uri $uri/ /index.html; }
 location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
 location ^~ /office-editor/ {
  set $office_backend http://office-documentserver;
  rewrite ^/office-editor(/.*)$ $1 break;
  proxy_pass $office_backend;
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Host $http_host/office-editor;
  proxy_set_header X-Forwarded-Proto $office_scheme;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $office_connection;
  proxy_read_timeout 3600s;
 }
 location ~ ^/api/v1/connections/(yandex|google)/callback$ {
  access_log off;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "frame-ancestors 'self'" always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header X-Content-Type-Options nosniff always;
  include fastcgi_params;
  fastcgi_pass backend_api;
  fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
  fastcgi_param SCRIPT_NAME /index.php;
  fastcgi_param HTTP_HOST $http_host;
 }
 location ~ ^/(api|sanctum|health|docs)(/|$) {
  include fastcgi_params;
  fastcgi_pass backend_api;
  fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
  fastcgi_param SCRIPT_NAME /index.php;
  fastcgi_param HTTP_HOST $http_host;
 }
}
