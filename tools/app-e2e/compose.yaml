name: modern-tech-app-e2e
services:
  postgres:
    image: postgres:18-alpine
    pull_policy: never
    environment:
      POSTGRES_DB: modern_tech_e2e
      POSTGRES_USER: modern_tech_e2e
      POSTGRES_PASSWORD: ${E2E_DB_PASSWORD:?Run bootstrap.py first}
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U modern_tech_e2e -d modern_tech_e2e]
      interval: 2s
      timeout: 3s
      retries: 20
  redis-queue:
    image: redis:7.4-alpine
    pull_policy: never
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 20
  redis-cache:
    image: redis:7.4-alpine
    pull_policy: never
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27
    pull_policy: never
    ports:
      - 127.0.0.1:${E2E_MAIL_PORT:-8893}:8025
  api:
    image: modern-tech-api:local
    pull_policy: never
    user: ${E2E_UID}:${E2E_GID}
    working_dir: /var/www/html
    env_file: ${E2E_BACKEND_ENV:?Run bootstrap.py first}
    environment:
      PHP_CLI_SERVER_WORKERS: "4"
    command: [php, artisan, serve, --host=0.0.0.0, --port=8000, --no-reload]
    volumes:
      - ${E2E_SOURCE_ROOT:?Run bootstrap.py first}/backend:/var/www/html
      - ${E2E_STATE_DIR:?Run bootstrap.py first}/files:/var/www/html/storage/app/private
    depends_on:
      postgres: {condition: service_healthy}
      redis-queue: {condition: service_healthy}
      redis-cache: {condition: service_healthy}
      mailpit: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:8000/health/live]
      interval: 2s
      timeout: 5s
      retries: 30
  web:
    image: node:24-alpine@sha256:f70403e87646dc51b45295f4b8b70cdad0b63d2297c4c9899119b03f7af7a6b3
    pull_policy: never
    working_dir: /app
    command: [sh, -c, "if [ ! -x node_modules/.bin/vite ]; then npm ci --ignore-scripts; fi; exec npm run dev"]
    environment:
      API_PROXY_TARGET: http://gateway
    volumes:
      - ${E2E_SOURCE_ROOT}/frontend:/app
      - web_modules:/app/node_modules
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 30
  gateway:
    image: nginx:1.28-alpine
    pull_policy: never
    ports:
      - 127.0.0.1:${E2E_APP_PORT:-8892}:80
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api: {condition: service_healthy}
      web: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1/ && wget -q -O /dev/null http://127.0.0.1/health/ready"]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  postgres:
  web_modules:
    external: true
    name: modern-tech-app-e2e_web_modules
