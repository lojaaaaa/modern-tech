<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Office co-editing prototype</title>
<style>
html,body{height:100%;margin:0;font:14px system-ui;background:#f4f4f4}body{display:flex;flex-direction:column}header{padding:8px 12px;display:flex;align-items:center;gap:14px;min-height:32px}header a{color:#2455a0}main{display:flex;flex:1;min-height:0}#office{flex:1;min-width:0}output{margin-left:auto}button,textarea{font:inherit}#error{background:#fdd;color:#900;padding:12px}iframe{border:0}aside{width:300px;overflow:auto;padding:12px;background:white;border-left:1px solid #ddd}aside h2{font-size:16px}textarea{box-sizing:border-box;width:100%;min-height:70px}article{padding:10px 0;border-top:1px solid #ddd;overflow-wrap:anywhere}article p{white-space:pre-wrap;margin:6px 0}article blockquote{margin:6px 0;color:#555}small{color:#555}#discussion-status{display:block;margin:8px 0}
</style>
<header><b>Изолированный прототип</b><span id="identity"></span><a href="/?file=sample.docx&user=alice">DOCX</a><a href="/?file=sample.xlsx&user=alice">XLSX</a><a href="/?file=sample.pptx&user=alice">PPTX</a><button id="save">Запросить сохранение</button><button id="close">Закрыть редактор</button><output id="status" aria-live="polite">Подключение</output></header>
<div id="error" hidden></div><main><div id="office"><div id="editor"></div></div><aside id="discussion" hidden><h2>Обсуждение черновика</h2><small>Выделите фрагмент в редакторе, затем добавьте замечание. Цвет автора в панели может отличаться от цвета курсора. В прототипе одновременные ответы могут перезаписать друг друга.</small><form id="comment-form"><textarea id="comment-text" aria-label="Текст замечания" required></textarea><button>Добавить замечание</button></form><span id="discussion-status" role="status">Ожидание плагина</span><div id="comments"></div></aside></main>
<script src="__OFFICE_PUBLIC_URL__/web-apps/apps/api/documents/api.js"></script>
<script type="module">
const params = new URLSearchParams(location.search);
const file = params.get('file') || 'sample.docx';
const user = params.get('user') || 'alice';
const validation = params.get('validation') === '1' ? '&validation=1' : '';
const discussionEnabled = params.get('discussion') === '1';
const response = await fetch(`/config?file=${encodeURIComponent(file)}&user=${encodeURIComponent(user)}${validation}${discussionEnabled ? '&discussion=1' : ''}`);
const config = await response.json();
const state = document.querySelector('#status');
let disconnectDiscussion = () => {};
document.querySelector('#identity').textContent = `${config.editorConfig?.user.name || user} · ${file}`;
config.events = {
 onAppReady: () => state.textContent = 'Редактор загружен',
 onDocumentReady: () => { state.textContent = 'Документ открыт'; window.pocReady = true; },
 onDocumentStateChange: event => state.textContent = event.data ? 'Изменения передаются редактору' : 'Редактор принял изменения; файл ещё требует callback',
 onError: event => { document.querySelector('#error').hidden = false; document.querySelector('#error').textContent = JSON.stringify(event.data); window.pocError = event.data; }
};
if (discussionEnabled) {
 document.querySelector('#discussion').hidden = false;
 const status = document.querySelector('#discussion-status');
 const list = document.querySelector('#comments');
 const pending = new Map();
 const drafts = new Map(), sending = new Set();
 let bridge, sequence = 0, refreshInProgress = false, refreshAgain = false;
 disconnectDiscussion = () => {
  bridge = null;
  for (const item of pending.values()) { clearTimeout(item.timer); item.reject(new Error('Редактор закрыт')); }
  pending.clear();
  status.textContent = 'Редактор закрыт; обсуждение недоступно';
  list.replaceChildren();
 };
 function request(op, value) {
  if (!bridge) return Promise.reject(new Error('Плагин ещё не подключён'));
  const id = ++sequence;
  return new Promise((resolve, reject) => {
   const timer = setTimeout(() => { pending.delete(id); reject(new Error('Нет ответа от плагина; перезагрузите страницу')); }, 15000);
   pending.set(id, { resolve, reject, timer });
   bridge.postMessage({ channel:'office-discussion-v1', kind:'request', file, user, id, op, value }, location.origin);
  });
 }
 function color(author) {
  if (!author) return '#555';
  let hash = 2166136261;
  for (const char of `${file}\0${author}`) hash = Math.imul(hash ^ char.charCodeAt(0), 16777619);
  return ['#19569a','#8b3260','#306339','#8c4b14','#57459b','#006b70'][Math.abs(hash % 6)];
 }
 function authorIdentity(data) {
  const display = data.UserName || 'Неизвестный автор';
  const fixtures = { alice: 'Алиса Петрова', bob: 'Борис Иванов' };
  const marker = Object.entries(fixtures).find(([id, name]) => display === `${name} [PoC:${id}]`);
  const userId = typeof data.UserId === 'string' && data.UserId ? data.UserId : null;
  // Do not guess identity from an unmarked display name or override a supplied ID.
  if (marker && (!userId || userId === marker[0])) return { name: marker[1], key: userId || marker[0] };
  return { name: display, key: userId };
 }
 function render(comments) {
  const active = document.activeElement;
  const activeId = active?.dataset.replyId;
  const selectionStart = activeId ? active.selectionStart : null, selectionEnd = activeId ? active.selectionEnd : null;
  list.replaceChildren();
  for (const comment of comments) {
   if (!comment || !comment.Data || !comment.Id) continue;
   const data = comment.Data, article = document.createElement('article');
   article.dataset.nativeId = String(comment.Id);
   const author = document.createElement('strong');
   const original = authorIdentity(data);
   author.textContent = original.name;
   author.style.color = color(original.key);
   article.append(author);
   if (data.QuoteText) { const quote = document.createElement('blockquote'); quote.textContent = data.QuoteText; article.append(quote); }
   const text = document.createElement('p'); text.textContent = data.Text || ''; article.append(text);
   for (const reply of data.Replies || []) {
    const line = document.createElement('p'), name = document.createElement('strong');
    const identity = authorIdentity(reply);
    name.textContent = `${identity.name}: `;
    name.style.color = color(identity.key);
    line.append(name, document.createTextNode(reply.Text || '')); article.append(line);
   }
   const id = String(comment.Id), form = document.createElement('form'), input = document.createElement('textarea'), submit = document.createElement('button');
   input.dataset.replyId = id; input.setAttribute('aria-label', 'Текст ответа'); input.required = true; input.value = drafts.get(id) || '';
   input.oninput = () => drafts.set(id, input.value);
   submit.textContent = 'Ответить'; submit.disabled = sending.has(id);
   form.append(input, submit);
   form.onsubmit = async event => {
    event.preventDefault();
    if (sending.has(id)) return;
    const text = input.value;
    sending.add(id); submit.disabled = true;
    try {
     await request('reply', { id, text });
     if (drafts.get(id) === text) drafts.delete(id);
     await refresh(); status.textContent = 'Ответ виден в редакторе';
    } catch (error) { status.textContent = error.message; }
    finally { sending.delete(id); for (const field of list.querySelectorAll('textarea[data-reply-id]')) if (field.dataset.replyId === id) field.form.querySelector('button').disabled = false; }
   };
   article.append(form);
   if (file.endsWith('.docx')) {
    const move = document.createElement('button'); move.type = 'button'; move.textContent = 'Перейти к фрагменту';
    move.onclick = () => request('move', String(comment.Id)).catch(error => { status.textContent = error.message; }); article.append(move);
   } else { const note = document.createElement('small'); note.textContent = 'Переход к фрагменту для этого формата не подтверждён'; article.append(note); }
   list.append(article);
  }
  if (activeId) {
   const field = Array.from(list.querySelectorAll('textarea[data-reply-id]')).find(item => item.dataset.replyId === activeId);
   if (field) { field.focus(); field.setSelectionRange(selectionStart, selectionEnd); }
  }
 }
 async function refresh() {
  if (refreshInProgress) { refreshAgain = true; return; }
  refreshInProgress = true;
  try { render(await request('list')); status.textContent = 'Обсуждение из редактора'; }
  catch (error) { status.textContent = `Не удалось обновить обсуждение: ${error.message}`; }
  finally { refreshInProgress = false; if (refreshAgain) { refreshAgain = false; refresh(); } }
 }
 window.addEventListener('message', event => {
  const data = event.data;
  if (event.origin !== location.origin || !data || data.channel !== 'office-discussion-v1' || data.file !== file || data.user !== user) return;
  if (data.kind === 'ready') { bridge = event.source; refresh(); return; }
  if (!bridge || event.source !== bridge) return;
  if (data.kind === 'changed') { refresh(); return; }
  const item = data.kind === 'response' && pending.get(data.id);
  if (item) { clearTimeout(item.timer); pending.delete(data.id); data.error ? item.reject(new Error(data.error)) : item.resolve(data.result); }
 });
 document.querySelector('#comment-form').onsubmit = async event => {
  event.preventDefault(); const input = document.querySelector('#comment-text');
  try { await request('add', input.value); input.value = ''; await refresh(); }
  catch (error) { status.textContent = error.message; }
 };
 setInterval(() => { if (bridge && !document.hidden) refresh(); }, 5000);
 window.addEventListener('focus', () => { if (bridge) refresh(); });
}
window.editor = new DocsAPI.DocEditor('editor', config);
document.querySelector('#save').onclick = async () => {
 const result = await (await fetch(`/forcesave/${file}`, {method:'POST'})).json();
 state.textContent = `Запрос сохранения: ${JSON.stringify(result)}. Подтверждение — /events`;
};
document.querySelector('#close').onclick = () => { disconnectDiscussion(); window.editor.destroyEditor(); state.textContent = 'Редактор закрыт; ожидание callback'; window.pocReady = false; };
</script>
</html>
