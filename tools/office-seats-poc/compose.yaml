name: modern-tech-office-seats-poc
services:
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes:
      - seats-redis:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 2s
      retries: 15
  gateway:
    image: node:24-alpine@sha256:f70403e87646dc51b45295f4b8b70cdad0b63d2297c4c9899119b03f7af7a6b3
    working_dir: /poc
    command: [node, server.mjs]
    environment:
      REDIS_HOST: redis
      POC_SECRET: ${POC_SECRET:-local-demo-only}
      LEASE_MS: ${LEASE_MS:-30000}
      OFFICE_INTERNAL_URL: http://documentserver
      JWT_SECRET: ${JWT_SECRET:-local-office-demo-only}
      POC_PUBLIC_PORT: ${POC_PORT:-8894}
      OFFICE_DATA_DIR: /office-data
    ports:
      - 127.0.0.1:${POC_PORT:-8894}:8894
    volumes:
      - ./:/poc:ro
      - office-files:/office-data
    depends_on:
      redis:
        condition: service_healthy
  documentserver:
    profiles: [editor]
    image: modern-tech-office-poc-documentserver:9.4.0.1-amd-fix
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${JWT_SECRET:-local-office-demo-only}
      JWT_HEADER: Authorization
      ALLOW_PRIVATE_IP_ADDRESS: "true"
      ALLOW_META_IP_ADDRESS: "false"
    shm_size: 1gb
    volumes:
      - office-data:/var/www/onlyoffice/Data
      - office-cache:/var/lib/onlyoffice
      - office-logs:/var/log/onlyoffice
volumes:
  office-data:
  office-cache:
  office-logs:
  seats-redis:
  office-files:
